<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPM Lab · Deteksi Bot</title>
  <link rel="stylesheet" href="../../shared/ui.css">
  <style>
    .lab { max-width: 860px; margin: 0 auto; padding: 16px; font-family: var(--f-mono); }
    .ctrl { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .ctrl input { background: var(--panel); border: 1px solid var(--line); color: var(--paper);
      border-radius: var(--radius); padding: 6px 10px; font-family: var(--f-mono); font-size: 12px; width: 90px; text-transform: uppercase; }
    .ctrl button { padding: 6px 14px; font-family: var(--f-mono); font-size: 12px; background: var(--phosphor-dim);
      color: var(--phosphor); border: 1px solid var(--phosphor-line); border-radius: var(--radius); cursor: pointer; }
    .out { font-size: 11.5px; line-height: 1.7; white-space: pre-wrap; color: var(--dim); }
    .sec { margin: 16px 0 6px; color: var(--paper); font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
    .hi { color: var(--phosphor); }
    .up { color: var(--up); } .down { color: var(--down); }
    .note { font-size: 9.5px; color: var(--ghost); margin: 8px 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <main class="lab">
    <div style="font-size:15px;font-weight:500;margin-bottom:4px">LPM Lab — Deteksi Order Terstruktur (Bot)</div>
    <div class="note">Uji konsep: market maker memecah order besar via bot → jejak di running-trade
      (group_order_number sama, ukuran lot berpola). Bandingkan dgn ritel (acak). Alat diagnostik, bukan fitur final.</div>
    <div class="ctrl">
      <input id="sym" placeholder="KODE" value="DSSA">
      <input id="lim" type="number" value="200" style="width:70px" title="jumlah transaksi">
      <button id="run">Analisa</button>
      <button id="bots">Deteksi Bot</button>
      <button id="dayfull">Tarik 1 Hari Penuh</button>
      <button id="probe">Uji Histori</button>
      <input id="minrep" type="number" value="5" style="width:56px" title="min pengulangan lot">
      <span id="status" class="note"></span>
    </div>
    <div id="out" class="out"></div>
  </main>

  <script type="module">
    import { renderHeader, whenTokenReady } from '../../shared/header.js'
    import { TOKEN } from '../../shared/store.js'
    import { botSeries, botNetDirection, lotSignatures } from './bot-engine.js'
    import { probePagination, fetchDayFull, normalizeTrades } from './history.js'

    const $ = id => document.getElementById(id)
    const HOST = 'https://exodus.stockbit.com'
    renderHeader($('app-header'), [{ label:'IHSG Suite', href:'../../index.html' }, { label:'LPM Lab' }])

    async function fetchRunning(sym, limit) {
      const tok = TOKEN.get()
      if (!tok) throw new Error('token belum diset')
      const url = `${HOST}/order-trade/running-trade?symbols%5B%5D=${encodeURIComponent(sym)}&sort=DESC&limit=${limit}&order_by=RUNNING_TRADE_ORDER_BY_TIME`
      const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + tok }, cache: 'no-store' })
      if (!r.ok) throw new Error('HTTP ' + r.status)
      const j = await r.json()
      return j?.data?.running_trade || []
    }

    function analyze(list) {
      const n = list.length
      if (!n) return 'Tidak ada transaksi (mungkin bursa tutup / emiten sepi).'
      const parse = t => ({ lot:+t.lot||0, action:t.action, price:+t.price||0,
        group:t.group_order_number, buyOrd:t.buy_order_number, sellOrd:t.sell_order_number,
        buyer:t.buyer, seller:t.seller, time:t.time, val:t.value?.raw||0 })
      const tx = list.map(parse)
      let s = ''
      s += `<div class="sec">Ringkasan</div>`
      s += `${n} transaksi · rentang ${tx[n-1].time} → ${tx[0].time}\n`
      const buys = tx.filter(t=>t.action==='buy'), sells = tx.filter(t=>t.action==='sell')
      const buyLot = buys.reduce((a,b)=>a+b.lot,0), sellLot = sells.reduce((a,b)=>a+b.lot,0)
      s += `beli <span class="up">${buys.length} tx / ${buyLot} lot</span> · jual <span class="down">${sells.length} tx / ${sellLot} lot</span>\n`

      // HIPOTESIS 1: group_order_number — order dipecah
      s += `<div class="sec">1. Order terpecah (group_order_number)</div>`
      const byGroup = {}
      for (const t of tx){ (byGroup[t.group] ??= []).push(t) }
      const groups = Object.entries(byGroup).sort((a,b)=>b[1].length-a[1].length)
      const multi = groups.filter(([,g])=>g.length>1)
      s += `${groups.length} group unik · ${multi.length} group dgn >1 pecahan\n`
      s += `<span class="note">Kalau banyak group berpecah → satu order induk dieksekusi bertahap (jejak bot).</span>\n`
      for (const [g,txs] of groups.slice(0,6)) {
        if (txs.length<2) continue
        const tot=txs.reduce((a,b)=>a+b.lot,0)
        const lots=txs.map(x=>x.lot)
        const uniq=[...new Set(lots)]
        s += `group <span class="hi">${g}</span>: ${txs.length} pecahan · ${tot} lot · ${txs[0].action} · lot=[${lots.slice(0,12).join(',')}]${uniq.length===1?' <span class="hi">← SERAGAM!</span>':''}\n`
      }

      // HIPOTESIS 2: keteraturan ukuran lot
      s += `<div class="sec">2. Keteraturan ukuran lot (sidik jari bot)</div>`
      const freq={}; for (const t of tx){ freq[t.lot]=(freq[t.lot]||0)+1 }
      const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10)
      s += `<span class="note">Ukuran lot mendominasi = pola bot. Tersebar acak = ritel.</span>\n`
      for (const [lot,cnt] of top) {
        const pct=(cnt/n*100).toFixed(0)
        s += `${String(lot).padStart(6)} lot: ${String(cnt).padStart(3)}x (${pct}%) ${'█'.repeat(Math.round(pct/2))}\n`
      }
      // konsentrasi: berapa % volume dari 3 ukuran terpopuler
      const top3cnt = top.slice(0,3).reduce((a,[,c])=>a+c,0)
      s += `\nKonsentrasi 3 ukuran teratas: <span class="hi">${(top3cnt/n*100).toFixed(0)}%</span> dari transaksi\n`

      // HIPOTESIS 3: broker berulang di satu sisi
      s += `<div class="sec">3. Broker dominan per sisi</div>`
      const brokerBuy={}, brokerSell={}
      for (const t of tx){ if(t.action==='buy') brokerBuy[t.buyer]=(brokerBuy[t.buyer]||0)+t.lot
                           else brokerSell[t.seller]=(brokerSell[t.seller]||0)+t.lot }
      const tb=Object.entries(brokerBuy).sort((a,b)=>b[1]-a[1]).slice(0,3)
      const ts=Object.entries(brokerSell).sort((a,b)=>b[1]-a[1]).slice(0,3)
      s += `top beli: ${tb.map(([b,l])=>`<span class="up">${b}</span> ${l}lot`).join(' · ')}\n`
      s += `top jual: ${ts.map(([b,l])=>`<span class="down">${b}</span> ${l}lot`).join(' · ')}\n`
      return s
    }

    // Tarik 1 hari penuh via paginasi trade_number, lalu deteksi bot dari data lengkap
    $('dayfull').addEventListener('click', async () => {
      const sym = $('sym').value.trim().toUpperCase()
      const date = prompt('Tanggal (YYYY-MM-DD), kosong = hari ini:', new Date(Date.now()+7*3600*1000).toISOString().slice(0,10))
      if (date === null) return
      const d = date.trim() || new Date(Date.now()+7*3600*1000).toISOString().slice(0,10)
      const minRep = +$('minrep').value || 5
      $('status').textContent = 'menguji paginasi…'; $('out').innerHTML = ''
      const tok = TOKEN.get()
      const fetchFn = async (url) => {
        const r = await fetch(url, { headers:{'Authorization':'Bearer '+tok}, cache:'no-store' })
        if (!r.ok) throw new Error('HTTP '+r.status)
        return (await r.json())?.data?.running_trade || []
      }
      try {
        // 1. uji paginasi dulu
        const probe = await probePagination(fetchFn, sym, d, 80)
        let s = `<div class="sec">Uji paginasi ${sym} @ ${d}</div>`
        s += `batch1: ${probe.batch1Count}tx (paling awal ${probe.batch1Earliest})\n`
        s += `batch2: ${probe.batch2Count}tx (paling akhir ${probe.batch2Latest}) · overlap ${probe.overlap}\n`
        s += probe.works
          ? `<span class="up">✓ PAGINASI BEKERJA — bisa gulir mundur, tarik hari penuh</span>\n\n`
          : `<span class="down">✗ paginasi tak menggulir mundur — hanya dapat sampel penutupan</span>\n\n`
        $('out').innerHTML = s

        // 2. tarik hari penuh
        $('status').textContent = 'menarik hari penuh…'
        const raw = await fetchDayFull(fetchFn, sym, d, { limit: 80, maxBatch: 40,
          onProgress: (tot, batch) => { $('status').textContent = `batch ${batch}, ${tot} tx…` } })
        const trades = normalizeTrades(raw)
        s += `<div class="sec">Data terkumpul: ${trades.length} transaksi</div>`
        if (trades.length) s += `rentang waktu ${trades[0].time} → ${trades[trades.length-1].time}\n\n`

        // 3. deteksi bot dari data lengkap
        const series = botSeries(trades, minRep)
        s += `<div class="sec">Bot terdeteksi (lot identik ≥${minRep}×, agresif)</div>`
        if (!series.length) s += `<span class="note">tak ada bot ≥${minRep}× di ${trades.length} transaksi.</span>`
        for (const b of series) {
          const dir = botNetDirection(trades, b.lot)
          const arrow = b.action==='buy'?'<span class="up">▲BELI</span>':'<span class="down">▼JUAL</span>'
          s += `<span class="hi">${b.lot} lot</span> ${arrow} · ${b.count}× · ${b.totalLot} lot · <span class="${dir.net>=0?'up':'down'}">${dir.bias}</span>\n`
        }
        if (series.length) { s += `\n<div class="sec">Grafik kumulatif</div>` + renderChart(series) }
        $('out').innerHTML = s
        $('status').textContent = `selesai · ${trades.length} tx`
      } catch(e) { $('status').textContent = 'gagal: ' + e.message }
    })

    // Deteksi bot: signature lot identik berulang-agresif + grafik kumulatif
    $('bots').addEventListener('click', async () => {
      const sym = $('sym').value.trim().toUpperCase()
      const lim = +$('lim').value || 200
      const minRep = +$('minrep').value || 5
      $('status').textContent = 'memuat…'; $('out').innerHTML = ''
      try {
        const list = await fetchRunning(sym, lim)
        $('status').textContent = `${list.length} transaksi`
        const trades = list.map(t => ({ lot:t.lot, action:t.action, time:t.time, price:t.price, value:t.value }))
        const series = botSeries(trades, minRep)
        let s = `<div class="sec">Bot terdeteksi (lot identik berulang ≥${minRep}×, agresif)</div>`
        if (!series.length) {
          s += `<span class="note">Tak ada ukuran lot yg berulang ≥${minRep}× di ${list.length} transaksi ini. Turunkan ambang atau coba emiten lain / saat bursa buka.</span>`
          $('out').innerHTML = s; return
        }
        s += `<span class="note">Tiap baris = 1 kandidat bot (ukuran lot + sisi). Garis = volume kumulatif dikumpulkan.</span>\n\n`
        for (const b of series) {
          const dir = botNetDirection(trades, b.lot)
          const arrow = b.action==='buy' ? '<span class="up">▲ BELI</span>' : '<span class="down">▼ JUAL</span>'
          s += `<span class="hi">${b.lot} lot</span> ${arrow} · ${b.count}× · total ${b.totalLot} lot · net ${b.lot}-lot: <span class="${dir.net>=0?'up':'down'}">${dir.bias}</span>\n`
        }
        // grafik garis kumulatif multi-bot
        s += `\n<div class="sec">Grafik volume kumulatif per bot</div>`
        s += renderChart(series)
        $('out').innerHTML = s
      } catch(e) { $('status').textContent = 'gagal: ' + e.message }
    })

    function renderChart(series) {
      const W=800, H=260, pad=40
      // gabung semua titik utk skala; sumbu-x = urutan transaksi (indeks), y = cumVolume
      const maxLen = Math.max(...series.map(s=>s.series.length))
      const maxVol = Math.max(...series.map(s=>s.series[s.series.length-1]?.cumVolume||0))
      if (!maxVol) return '<span class="note">data kosong</span>'
      const colors = ['#2bb383','#e07444','#e8b34a','#22d3ee','#c084fc','#fb7185']
      const x = i => pad + (i/(maxLen-1||1))*(W-2*pad)
      const y = v => H-pad - (v/maxVol)*(H-2*pad)
      let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-top:6px">`
      // axis
      svg += `<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line-hi)"/>`
      svg += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="var(--line-hi)"/>`
      svg += `<text x="${pad}" y="${pad-6}" fill="var(--ghost)" font-size="9" font-family="monospace">vol kumulatif (maks ${maxVol})</text>`
      series.forEach((b,bi)=>{
        const col = colors[bi%colors.length]
        const pts = b.series.map((p,i)=>`${x(i)},${y(p.cumVolume)}`).join(' ')
        svg += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8"/>`
        // label di ujung
        const last = b.series[b.series.length-1]
        svg += `<text x="${x(b.series.length-1)+4}" y="${y(last.cumVolume)}" fill="${col}" font-size="9" font-family="monospace">${b.lot}${b.action==='buy'?'B':'S'}</text>`
      })
      svg += `</svg>`
      return svg
    }

    $('run').addEventListener('click', async () => {
      const sym = $('sym').value.trim().toUpperCase()
      const lim = +$('lim').value || 200
      $('status').textContent = 'memuat…'; $('out').innerHTML = ''
      try {
        const list = await fetchRunning(sym, lim)
        $('status').textContent = `${list.length} transaksi`
        $('out').innerHTML = analyze(list)
      } catch(e) { $('status').textContent = 'gagal: ' + e.message }
    })

    // Uji apakah endpoint running-trade bisa ambil data LAMPAU (syarat konsep 1 tahun)
    $('probe').addEventListener('click', async () => {
      const sym = $('sym').value.trim().toUpperCase()
      const tok = TOKEN.get()
      if (!tok) return $('status').textContent = 'token belum diset'
      $('status').textContent = 'menguji parameter histori…'
      const base = `${HOST}/order-trade/running-trade`
      const yst = new Date(Date.now() - 3*86400*1000).toISOString().slice(0,10) // 3 hari lalu
      const sp = `symbols%5B%5D=${sym}&sort=DESC&limit=50&order_by=RUNNING_TRADE_ORDER_BY_TIME`
      const variants = [
        [`date=${yst}`,            `${base}?${sp}&date=${yst}`],
        [`from/to=${yst}`,         `${base}?${sp}&from=${yst}&to=${yst}`],
        [`start_date=${yst}`,      `${base}?${sp}&start_date=${yst}&end_date=${yst}`],
        [`page=2`,                 `${base}?${sp}&page=2`],
        [`offset=100`,             `${base}?${sp}&offset=100`],
        [`before (id)`,            `${base}?${sp}&before=1`],
      ]
      let out = '<div class="sec">Uji parameter histori running-trade</div>'
      out += '<span class="note">Cari parameter yg mengembalikan transaksi dari tanggal LAMPAU. Kalau semua cuma kasih data terbaru → endpoint real-time-only, konsep 1 tahun tak bisa dari sini.</span>\n\n'
      for (const [label, url] of variants) {
        try {
          const r = await fetch(url, { headers: { 'Authorization':'Bearer '+tok }, cache:'no-store' })
          const j = await r.json().catch(()=>({}))
          const list = j?.data?.running_trade || []
          const t0 = list[list.length-1]?.time, t1 = list[0]?.time
          out += `<span class="hi">${label}</span>: HTTP ${r.status} · ${list.length} tx · waktu ${t0||'-'}→${t1||'-'}\n`
        } catch(e) { out += `${label}: ERR ${e.message}\n` }
        await new Promise(r=>setTimeout(r,300))
      }
      out += '\n<span class="note">Kalau kolom waktu semua sama (jam terbaru) apa pun parameternya → endpoint abaikan tanggal = real-time only.</span>'
      $('out').innerHTML = out
      $('status').textContent = 'uji selesai'
    })

    ;(async () => { await whenTokenReady(); $('status').textContent = 'siap — klik Analisa' })()
  </script>
</body>
</html>
