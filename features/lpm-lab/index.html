<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPM Lab · Deteksi Bot</title>
  <link rel="stylesheet" href="../../shared/ui.css">
  <style>
    .lab { max-width: 860px; margin: 0 auto; padding: 16px; font-family: var(--f-mono); }
    .ctrl { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .ctrl input { background: var(--panel); border: 1px solid var(--line); color: var(--paper);
      border-radius: var(--radius); padding: 6px 10px; font-family: var(--f-mono); font-size: 12px; width: 90px; text-transform: uppercase; }
    .ctrl button { padding: 6px 14px; font-family: var(--f-mono); font-size: 12px; background: var(--phosphor-dim);
      color: var(--phosphor); border: 1px solid var(--phosphor-line); border-radius: var(--radius); cursor: pointer; }
    .out { font-size: 11.5px; line-height: 1.7; white-space: pre-wrap; color: var(--dim); }
    .sec { margin: 16px 0 6px; color: var(--paper); font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
    .hi { color: var(--phosphor); }
    .up { color: var(--up); } .down { color: var(--down); }
    .note { font-size: 9.5px; color: var(--ghost); margin: 8px 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <main class="lab">
    <div style="font-size:15px;font-weight:500;margin-bottom:4px">LPM Lab — Deteksi Order Terstruktur (Bot)</div>
    <div class="note">Uji konsep: market maker memecah order besar via bot → jejak di running-trade
      (group_order_number sama, ukuran lot berpola). Bandingkan dgn ritel (acak). Alat diagnostik, bukan fitur final.</div>
    <div class="ctrl">
      <input id="sym" placeholder="KODE" value="DSSA">
      <input id="lim" type="number" value="200" style="width:70px" title="jumlah transaksi">
      <button id="run">Analisa</button>
      <span id="status" class="note"></span>
    </div>
    <div id="out" class="out"></div>
  </main>

  <script type="module">
    import { renderHeader, whenTokenReady } from '../../shared/header.js'
    import { TOKEN } from '../../shared/store.js'

    const $ = id => document.getElementById(id)
    const HOST = 'https://exodus.stockbit.com'
    renderHeader($('app-header'), [{ label:'IHSG Suite', href:'../../index.html' }, { label:'LPM Lab' }])

    async function fetchRunning(sym, limit) {
      const tok = TOKEN.get()
      if (!tok) throw new Error('token belum diset')
      const url = `${HOST}/order-trade/running-trade?symbols%5B%5D=${encodeURIComponent(sym)}&sort=DESC&limit=${limit}&order_by=RUNNING_TRADE_ORDER_BY_TIME`
      const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + tok }, cache: 'no-store' })
      if (!r.ok) throw new Error('HTTP ' + r.status)
      const j = await r.json()
      return j?.data?.running_trade || []
    }

    function analyze(list) {
      const n = list.length
      if (!n) return 'Tidak ada transaksi (mungkin bursa tutup / emiten sepi).'
      const parse = t => ({ lot:+t.lot||0, action:t.action, price:+t.price||0,
        group:t.group_order_number, buyOrd:t.buy_order_number, sellOrd:t.sell_order_number,
        buyer:t.buyer, seller:t.seller, time:t.time, val:t.value?.raw||0 })
      const tx = list.map(parse)
      let s = ''
      s += `<div class="sec">Ringkasan</div>`
      s += `${n} transaksi · rentang ${tx[n-1].time} → ${tx[0].time}\n`
      const buys = tx.filter(t=>t.action==='buy'), sells = tx.filter(t=>t.action==='sell')
      const buyLot = buys.reduce((a,b)=>a+b.lot,0), sellLot = sells.reduce((a,b)=>a+b.lot,0)
      s += `beli <span class="up">${buys.length} tx / ${buyLot} lot</span> · jual <span class="down">${sells.length} tx / ${sellLot} lot</span>\n`

      // HIPOTESIS 1: group_order_number — order dipecah
      s += `<div class="sec">1. Order terpecah (group_order_number)</div>`
      const byGroup = {}
      for (const t of tx){ (byGroup[t.group] ??= []).push(t) }
      const groups = Object.entries(byGroup).sort((a,b)=>b[1].length-a[1].length)
      const multi = groups.filter(([,g])=>g.length>1)
      s += `${groups.length} group unik · ${multi.length} group dgn >1 pecahan\n`
      s += `<span class="note">Kalau banyak group berpecah → satu order induk dieksekusi bertahap (jejak bot).</span>\n`
      for (const [g,txs] of groups.slice(0,6)) {
        if (txs.length<2) continue
        const tot=txs.reduce((a,b)=>a+b.lot,0)
        const lots=txs.map(x=>x.lot)
        const uniq=[...new Set(lots)]
        s += `group <span class="hi">${g}</span>: ${txs.length} pecahan · ${tot} lot · ${txs[0].action} · lot=[${lots.slice(0,12).join(',')}]${uniq.length===1?' <span class="hi">← SERAGAM!</span>':''}\n`
      }

      // HIPOTESIS 2: keteraturan ukuran lot
      s += `<div class="sec">2. Keteraturan ukuran lot (sidik jari bot)</div>`
      const freq={}; for (const t of tx){ freq[t.lot]=(freq[t.lot]||0)+1 }
      const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10)
      s += `<span class="note">Ukuran lot mendominasi = pola bot. Tersebar acak = ritel.</span>\n`
      for (const [lot,cnt] of top) {
        const pct=(cnt/n*100).toFixed(0)
        s += `${String(lot).padStart(6)} lot: ${String(cnt).padStart(3)}x (${pct}%) ${'█'.repeat(Math.round(pct/2))}\n`
      }
      // konsentrasi: berapa % volume dari 3 ukuran terpopuler
      const top3cnt = top.slice(0,3).reduce((a,[,c])=>a+c,0)
      s += `\nKonsentrasi 3 ukuran teratas: <span class="hi">${(top3cnt/n*100).toFixed(0)}%</span> dari transaksi\n`

      // HIPOTESIS 3: broker berulang di satu sisi
      s += `<div class="sec">3. Broker dominan per sisi</div>`
      const brokerBuy={}, brokerSell={}
      for (const t of tx){ if(t.action==='buy') brokerBuy[t.buyer]=(brokerBuy[t.buyer]||0)+t.lot
                           else brokerSell[t.seller]=(brokerSell[t.seller]||0)+t.lot }
      const tb=Object.entries(brokerBuy).sort((a,b)=>b[1]-a[1]).slice(0,3)
      const ts=Object.entries(brokerSell).sort((a,b)=>b[1]-a[1]).slice(0,3)
      s += `top beli: ${tb.map(([b,l])=>`<span class="up">${b}</span> ${l}lot`).join(' · ')}\n`
      s += `top jual: ${ts.map(([b,l])=>`<span class="down">${b}</span> ${l}lot`).join(' · ')}\n`
      return s
    }

    $('run').addEventListener('click', async () => {
      const sym = $('sym').value.trim().toUpperCase()
      const lim = +$('lim').value || 200
      $('status').textContent = 'memuat…'; $('out').innerHTML = ''
      try {
        const list = await fetchRunning(sym, lim)
        $('status').textContent = `${list.length} transaksi`
        $('out').innerHTML = analyze(list)
      } catch(e) { $('status').textContent = 'gagal: ' + e.message }
    })

    ;(async () => { await whenTokenReady(); $('status').textContent = 'siap — klik Analisa' })()
  </script>
</body>
</html>
